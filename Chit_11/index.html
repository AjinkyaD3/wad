<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Registration Form</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f0f4ff, #e8ecf8); padding: 50px; }
        .form-container { background: white; padding: 30px; border-radius: 12px; max-width: 500px; margin: auto; box-shadow: 0 10px 30px rgba(99,102,241,0.1); }
        h1 { text-align: center; color: #1e293b; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #374151; }
        input[type="text"], input[type="email"], input[type="password"], select, textarea {
            width: 100%; padding: 10px; border: 2px solid #e0e7ff; border-radius: 8px; box-sizing: border-box; transition: border 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #6366f1; outline: none; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Static Form</h1>
        <form>
            <div class="form-group">
                <label>User ID</label>
                <input type="text" name="userid" placeholder="Enter ID">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="pass" placeholder="Password">
            </div>
            <div class="form-group">
                <label>State</label>
                <select name="state">
                    <option>Maharashtra</option>
                    <option>Karnataka</option>
                    <option>Gujarat</option>
                </select>
            </div>
            <button type="submit">Submit Form</button>
        </form>
    </div>
</body>
</html>
