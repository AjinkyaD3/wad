<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login Validation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 100px; background: linear-gradient(135deg, #f0f4ff, #e8ecf8); }
        .box { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(99,102,241,0.1); width: 340px; }
        h3 { color: #1e293b; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid #e0e7ff; border-radius: 8px; box-sizing: border-box; transition: border 0.3s; }
        input:focus { border-color: #6366f1; outline: none; }
        button { width: 100%; padding: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="box">
        <h3>Login</h3>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Validate</button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            if (u.length < 5) {
                alert("Username must be at least 5 chars");
            } else if (p.length < 5) {
                alert("Password must be at least 5 chars");
            } else {
                alert("Validation Passed!");
            }
        });
    </script>
</body>
</html>
