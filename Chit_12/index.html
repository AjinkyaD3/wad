<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlinks Demo - Page 1</title>
    <style>
        body { font-family: sans-serif; padding: 40px; line-height: 1.6; }
        section { height: 600px; padding: 20px; border: 1px solid #ddd; margin: 20px 0; }
        nav { background: #eee; padding: 10px; position: sticky; top: 0; }
    </style>
</head>
<body>
    <h1>Hyperlinks Demonstration</h1>
    
    <nav>
        <strong>Within Page:</strong>
        <a href="#section1">Section 1</a> | 
        <a href="#section2">Section 2</a> | 
        <a href="#section3">Section 3</a> |
        <strong>Between Pages:</strong>
        <a href="page2.html">Go to Page 2 →</a>
    </nav>

    <section id="section1" style="background: #fff5f5;">
        <h2>Section 1</h2>
        <p>This is the first section. You can jump here using an anchor link.</p>
    </section>

    <section id="section2" style="background: #f5fff5;">
        <h2>Section 2</h2>
        <p>Scroll down or use the nav to reach me.</p>
    </section>

    <section id="section3" style="background: #f5f5ff;">
        <h2>Section 3</h2>
        <p>Bottom of the page!</p>
        <a href="#">Back to Top ↑</a>
    </section>
</body>
</html>
