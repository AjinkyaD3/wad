<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - AJAX/LocalStorage</title>
    <style>
        body { font-family: system-ui; padding: 40px; background: #f0f4f8; }
        .card { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #6366f1; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; }
        .nav { text-align: center; margin-top: 20px; }
        a { color: #6366f1; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Register User</h2>
        <form id="ajaxForm">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="city" placeholder="City" required>
            <button type="submit">Submit Data</button>
        </form>
    </div>
    <div class="nav">
        <a href="list.html">View Registered Users →</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
