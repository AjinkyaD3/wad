<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Time-Table</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 40px; background: #f0f4ff; }
        h1 { text-align: center; color: white; background: linear-gradient(135deg, #4338ca, #6366f1); padding: 20px; border-radius: 12px 12px 0 0; margin-bottom: 0; }
        table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 10px 25px rgba(99,102,241,0.1); }
        th, td { border: 1px solid #e5e7eb; padding: 14px; text-align: center; }
        th { background: #4f46e5; color: white; text-transform: uppercase; letter-spacing: 0.05em; }
        tr:nth-child(even) { background: #f8faff; }
        tr:hover { background: #eef2ff; }
        .break { background: #fef2f2 !important; font-weight: bold; color: #991b1b; }
        td:first-child { font-weight: 600; color: #4338ca; background: #f5f3ff; }
    </style>
</head>
<body>
    <h1>Class Time-Table</h1>
    <table>
        <thead>
            <tr>
                <th>Time / Day</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>10:00 - 11:00</td><td>WAD (Lab)</td><td>CNS</td><td>CC</td><td>DSBDA</td><td>Internship</td>
            </tr>
            <tr>
                <td>11:00 - 12:00</td><td>CC</td><td>WAD</td><td>DSBDA</td><td>CNS</td><td>Internship</td>
            </tr>
            <tr class="break">
                <td>12:00 - 12:45</td><td colspan="5">LUNCH BREAK</td>
            </tr>
            <tr>
                <td>12:45 - 01:45</td><td>DSBDA</td><td>CC</td><td>CNS</td><td>WAD</td><td>Internship</td>
            </tr>
            <tr>
                <td>01:45 - 02:45</td><td>CNS</td><td>DSBDA</td><td>CC</td><td>WAD</td><td>Internship</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
