<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Node Website</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #eef2f3; }
        .container { background: white; padding: 40px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Node.js Static Server</h1>
        <p>This website is being served by an Express server.</p>
        <p>To run this: <code>npm install express</code> then <code>node server.js</code></p>
    </div>
</body>
</html>
