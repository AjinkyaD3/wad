<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Node Website</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 80px; background: linear-gradient(135deg, #f0f4ff, #e8ecf8); min-height: 100vh; margin: 0; }
        .container { background: white; padding: 50px; border-radius: 16px; display: inline-block; box-shadow: 0 15px 40px rgba(99,102,241,0.12); }
        h1 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 8px; }
        code { background: #e0e7ff; color: #4338ca; padding: 3px 10px; border-radius: 6px; font-size: 0.9rem; }
        .badge { display: inline-block; margin-top: 15px; padding: 6px 16px; background: linear-gradient(135deg, #10b981, #34d399); color: white; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Node.js Static Server</h1>
        <p>This website is served by an Express.js server.</p>
        <p>Run: <code>npm install express</code> then <code>node server.js</code></p>
        <div class="badge">✓ Server Active on Port 3000</div>
    </div>
</body>
</html>
