<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Login Validation</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; width: 400px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 2rem; }
        .input-group { margin-bottom: 1.5rem; position: relative; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: #94a3b8; }
        input { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
        
        /* Tooltip (Toolkit) Styles */
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 0;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.2s, visibility 0.2s;
            z-index: 20;
            margin-bottom: 10px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            width: 200px;
        }
        .tooltip div { margin-bottom: 2px; color: #f87171; transition: color 0.2s; }
        .tooltip div.valid { color: #4ade80; }
        .tooltip div.valid::before { content: "✓ "; }
        .tooltip div.invalid::before { content: "× "; }

        .tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 15px;
            border-width: 5px;
            border-style: solid;
            border-color: #334155 transparent transparent transparent;
        }
        input:focus + .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .error { color: #f87171; font-size: 0.75rem; margin-top: 0.5rem; display: none; line-height: 1.4; }
        button { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none; background: #3b82f6; color: white; font-weight: 600; cursor: pointer; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Secure Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" autocomplete="off">
                <div class="tooltip" id="userTooltip">
                    <div id="u-cap" class="invalid">One Uppercase</div>
                    <div id="u-small" class="invalid">One Lowercase</div>
                    <div id="u-num" class="invalid">One Number</div>
                    <div id="u-spec" class="invalid">One Special Char</div>
                    <div id="u-len" class="invalid">8+ Characters</div>
                </div>
                <div id="userError" class="error">
                    Validation Failed. Please check requirements.
                </div>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div class="tooltip" id="passTooltip">
                    <div id="p-cap" class="invalid">One Uppercase</div>
                    <div id="p-small" class="invalid">One Lowercase</div>
                    <div id="p-spec" class="invalid">One Special Char</div>
                    <div id="p-len" class="invalid">8+ Characters</div>
                </div>
                <div id="passError" class="error">
                    Validation Failed. Please check requirements.
                </div>
            </div>
            <button type="submit">Sign In</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
