<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f0f4ff, #e8ecf8); padding: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(99,102,241,0.1); }
        h2 { color: #1e293b; margin-bottom: 20px; }
        .error { color: #dc2626; font-size: 12px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #e0e7ff; border-radius: 8px; box-sizing: border-box; transition: border 0.3s; }
        input:focus { border-color: #6366f1; outline: none; }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, #10b981, #34d399); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Name">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <input type="password" id="confirm" placeholder="Confirm Password">
            <button type="submit">Validate</button>
        </form>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const confirm = document.getElementById('confirm').value;

            if (name === "") alert("Name is required");
            else if (!email.includes("@")) alert("Invalid email");
            else if (pass.length < 8) alert("Password must be 8+ chars");
            else if (pass !== confirm) alert("Passwords do not match");
            else alert("Registration Form is Valid!");
        });
    </script>
</body>
</html>
