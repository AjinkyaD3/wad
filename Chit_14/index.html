<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form Validation</title>
    <style>
        body { font-family: sans-serif; background: #fafafa; padding: 50px; }
        .container { max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .error { color: red; font-size: 12px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Register</h2>
        <form id="regForm">
            <input type="text" id="name" placeholder="Name">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <input type="password" id="confirm" placeholder="Confirm Password">
            <button type="submit">Validate</button>
        </form>
    </div>
    <script>
        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const pass = document.getElementById('pass').value;
            const confirm = document.getElementById('confirm').value;

            if (name === "") alert("Name is required");
            else if (!email.includes("@")) alert("Invalid email");
            else if (pass.length < 8) alert("Password must be 8+ chars");
            else if (pass !== confirm) alert("Passwords do not match");
            else alert("Registration Form is Valid!");
        });
    </script>
</body>
</html>
