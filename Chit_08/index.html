<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Implementation (Old & Modern)</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 50px; }
        .container { max-width: 600px; margin: auto; text-align: center; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .btn { padding: 12px 24px; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-modern { background: #6366f1; }
        .btn-old { background: #64748b; }
        #output { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: left; min-height: 100px; }
        .user-item { padding: 10px; border-bottom: 1px solid #eee; }
        .method-label { font-size: 0.8rem; background: #e2e8f0; padding: 2px 8px; border-radius: 4px; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AJAX Data Fetch</h1>
        <div class="btn-group">
            <button class="btn btn-modern" onclick="fetchDataModern()">Fetch API (Modern)</button>
            <button class="btn btn-old" onclick="fetchDataOld()">XMLHttpRequest (Old)</button>
        </div>
        <div id="output">Click a button to load data...</div>
    </div>

    <script>
        const output = document.getElementById('output');

        // 1. Modern AJAX: Fetch API
        function fetchDataModern() {
            output.innerHTML = "Loading via Fetch...";
            
            fetch('https://jsonplaceholder.typicode.com/users')
                .then(response => response.json())
                .then(data => {
                    renderData(data, 'Modern (Fetch)');
                })
                .catch(err => {
                    output.innerHTML = "Error loading data via Fetch.";
                    console.error(err);
                });
        }

        // 2. Old AJAX: XMLHttpRequest (XHR)
        function fetchDataOld() {
            output.innerHTML = "Loading via XHR...";
            
            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://jsonplaceholder.typicode.com/users', true);
            
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) { // Request finished
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        renderData(data, 'Old (XHR)');
                    } else {
                        output.innerHTML = "Error loading data via XHR.";
                    }
                }
            };
            
            xhr.send();
        }

        function renderData(data, method) {
            let html = `<h3>User List <span class="method-label">${method}</span></h3>`;
            data.forEach(user => {
                html += `
                    <div class="user-item">
                        <strong>${user.name}</strong><br>
                        <small>${user.email} | ${user.company.name}</small>
                    </div>
                `;
            });
            output.innerHTML = html;
        }
    </script>
</body>
</html>
