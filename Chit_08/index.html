<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Implementation</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f0f4ff, #e8ecf8); padding: 50px; }
        .container { max-width: 600px; margin: auto; text-align: center; }
        h1 { color: #1e293b; margin-bottom: 10px; }
        p { color: #64748b; margin-bottom: 20px; }
        button { padding: 14px 30px; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; background: linear-gradient(135deg, #6366f1, #8b5cf6); transition: transform 0.2s; }
        button:hover { transform: scale(1.03); }
        #output { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 8px 25px rgba(99,102,241,0.1); text-align: left; min-height: 100px; margin-top: 20px; }
        .user-item { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .user-item:last-child { border: none; }
        .method-tag { font-size: 0.75rem; background: #e0e7ff; color: #4338ca; padding: 3px 10px; border-radius: 1rem; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AJAX Data Fetch</h1>
        <p>Fetches user data from API using XMLHttpRequest</p>
        <button onclick="fetchWithXHR()">Load Users (XHR)</button>
        <div id="output">Click the button to load data...</div>
    </div>

    <script>
        const output = document.getElementById('output');

        function fetchWithXHR() {
            output.innerHTML = "Loading via XMLHttpRequest...";

            const xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://jsonplaceholder.typicode.com/users', true);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        const data = JSON.parse(xhr.responseText);
                        renderData(data, 'XMLHttpRequest');
                    } else {
                        output.innerHTML = "Error: " + xhr.status;
                    }
                }
            };

            xhr.send();
        }

        /* 
        function fetchDataModern() {
            output.innerHTML = "Loading via Fetch API...";

            fetch('https://jsonplaceholder.typicode.com/users')
                .then(response => response.json())
                .then(data => renderData(data, 'Fetch API'))
                .catch(err => { output.innerHTML = "Fetch Error: " + err; });
        }
        */

        function renderData(data, method) {
            let html = `<h3>User List <span class="method-tag">${method}</span></h3>`;
            data.forEach(user => {
                html += `<div class="user-item">
                    <strong>${user.name}</strong><br>
                    <small>${user.email} | ${user.company.name}</small>
                </div>`;
            });
            output.innerHTML = html;
        }
    </script>
</body>
</html>
