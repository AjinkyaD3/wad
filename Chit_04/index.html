<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styles Demo</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f0f4ff, #e8ecf8); padding: 40px; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 30px; }
        .internal-box {
            background: linear-gradient(135deg, #e0f2f1, #b2dfdb);
            padding: 25px;
            border: 2px solid #009688;
            border-radius: 12px;
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .internal-box:hover { transform: translateY(-3px); }
        h2 { color: #00796b; }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: auto;">
        <h1>CSS Styling Demonstration</h1>

        <div style="background: linear-gradient(135deg, #fff3e0, #ffe0b2); padding: 25px; border: 2px solid #ff9800; border-radius: 12px; margin-bottom: 20px; transition: transform 0.3s;">
            <h2 style="color: #e65100;">1. Inline CSS</h2>
            <p>This box uses the <code>style</code> attribute directly on HTML elements.</p>
        </div>

        <div class="internal-box">
            <h2>2. Internal CSS</h2>
            <p>This box uses a <code>&lt;style&gt;</code> block inside the HTML <code>&lt;head&gt;</code>.</p>
        </div>

        <div class="external-box">
            <h2>3. External CSS</h2>
            <p>This box uses a separate <code>.css</code> file linked in the head.</p>
        </div>
    </div>
</body>
</html>
