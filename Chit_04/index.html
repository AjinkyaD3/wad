<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Styles Demo</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal CSS -->
    <style>
        .internal-box {
            background-color: #e0f2f1;
            padding: 20px;
            border: 2px solid #009688;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        h2 { color: #00796b; }
    </style>
</head>
<body>
    <div style="max-width: 800px; margin: 40px auto; font-family: sans-serif;">
        <h1>CSS Styling Demonstration</h1>

        <!-- Inline CSS -->
        <div style="background-color: #fff3e0; padding: 20px; border: 2px solid #ff9800; border-radius: 8px; margin-bottom: 20px;">
            <h2 style="color: #e65100;">1. Inline CSS</h2>
            <p>This box is styled using the <code>style</code> attribute directly on HTML elements.</p>
        </div>

        <!-- Internal CSS -->
        <div class="internal-box">
            <h2>2. Internal CSS</h2>
            <p>This box is styled using a <code>&lt;style&gt;</code> block inside the HTML <code>&lt;head&gt;</code>.</p>
        </div>

        <!-- External CSS -->
        <div class="external-box">
            <h2>3. External CSS</h2>
            <p>This box is styled using a separate <code>.css</code> file linked in the head.</p>
        </div>
    </div>
</body>
</html>
